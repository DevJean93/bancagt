# Aplicación bancaria en el namespace banca-prod (aislado, Pod Security "restricted").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banca
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/DevJean93/bancagt.git
    targetRevision: main
    path: deploy/charts/banca
    helm:
      releaseName: banca
      valueFiles:
        - ../../envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: banca-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        # Pod Security Admission: Kubernetes rechaza cualquier pod que no cumpla
        # el perfil "restricted" (root, privilegios, capabilities, hostPath...).
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: latest
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
        banca/zona: produccion
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
  # Argo Rollouts ajusta pesos y selectores durante el canary: Argo CD no debe revertirlo.
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      jsonPointers:
        - /spec/weighted/services
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/selector
