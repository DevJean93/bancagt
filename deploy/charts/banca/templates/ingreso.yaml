# Ingreso público: HTTPS con TLS 1.3 (TLSOption "default" en el namespace traefik),
# HSTS aplicado en el entrypoint, límite de peticiones y encabezados de seguridad.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: banca-tls
spec:
  secretName: banca-tls
  dnsNames:
    - banca.{{ .Values.dominio }}
  duration: 2160h     # 90 días
  renewBefore: 360h   # se renueva 15 días antes (rotación automática)
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: bancagt-ca
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limite-peticiones
spec:
  rateLimit:
    average: {{ .Values.rateLimit.promedio }}
    burst: {{ .Values.rateLimit.rafaga }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: limite-cuerpo
spec:
  buffering:
    maxRequestBodyBytes: 16384
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: banca
spec:
  entryPoints: [websecure]
  routes:
    {{- range $nombre, $svc := .Values.servicios }}
    {{- range $ruta := $svc.rutas }}
    {{- if ne $ruta "/" }}
    - kind: Rule
      match: Host(`banca.{{ $.Values.dominio }}`) && PathPrefix(`{{ $ruta }}`)
      middlewares:
        - name: limite-peticiones
        - name: limite-cuerpo
      services:
        - kind: TraefikService
          name: {{ $nombre }}-ponderado
    {{- end }}
    {{- end }}
    {{- end }}
    {{- range $nombre, $svc := .Values.servicios }}
    {{- if has "/" $svc.rutas }}
    - kind: Rule
      match: Host(`banca.{{ $.Values.dominio }}`)
      priority: 1
      middlewares:
        - name: limite-peticiones
      services:
        - kind: TraefikService
          name: {{ $nombre }}-ponderado
    {{- end }}
    {{- end }}
  tls:
    secretName: banca-tls
