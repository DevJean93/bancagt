# =====================================================================
# Zero Trust en la red del namespace: todo se niega por defecto y solo se
# abren los flujos estrictamente necesarios (PCI-DSS 1.3 / segmentación).
#
#   Internet → Traefik → web-banca / api-* → banca-db → S3 de respaldos
# =====================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-todo
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Zona DMZ → aplicación: solo el Ingress Controller entra a los microservicios.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingreso-desde-traefik
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: bancagt }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: traefik }
      ports:
        - { protocol: TCP, port: 8080 }
---
# Prometheus puede leer /metrics de las APIs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metricas-desde-prometheus
spec:
  podSelector:
    matchLabels: { banca/metricas: "true" }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 8080 }
---
# Zona aplicación → datos: solo las APIs llegan a PostgreSQL, y envían trazas a Tempo.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-salida
spec:
  podSelector:
    matchLabels: { banca/cliente-db: "true" }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: banca-db }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: observabilidad }
          podSelector:
            matchLabels: { app.kubernetes.io/name: tempo }
      ports:
        - { protocol: TCP, port: 4318 }
---
# Zona de datos: PostgreSQL acepta conexiones solo de las APIs, de su propia
# réplica, del operador CNPG y de Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: base-datos
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: banca-db }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { banca/cliente-db: "true" }
        - podSelector:
            matchLabels: { cnpg.io/cluster: banca-db }
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - podSelector:
            matchLabels: { cnpg.io/cluster: banca-db }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
      ports:
        - { protocol: TCP, port: 8000 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports:
        - { protocol: TCP, port: 9187 }
  egress:
    # Replicación entre instancias.
    - to:
        - podSelector:
            matchLabels: { cnpg.io/cluster: banca-db }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    # Plugin de respaldo Barman Cloud (gRPC con mTLS) en cnpg-system.
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
    # API de Kubernetes (el instance manager de CNPG la consulta) y S3 de respaldos
    # (contenedor SeaweedFS en la red Docker de kind).
    - to:
        - ipBlock: { cidr: 172.16.0.0/12 }
        - ipBlock: { cidr: 10.96.0.1/32 }
      ports:
        - { protocol: TCP, port: 6443 }
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 8333 }
