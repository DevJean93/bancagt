# Secretos fuera del código: Vault es la fuente de verdad. External Secrets
# se autentica con una cuenta de servicio (sin tokens fijos), lee solo
# secret/banca/* y refresca cada minuto → una rotación en Vault llega sola.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-banca
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-banca
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    vault:
      server: {{ .Values.vault.servidor }}
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.vault.rol }}
          serviceAccountRef:
            name: eso-banca
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banca-db-app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault-banca
  target:
    name: banca-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG vigila los secretos con esta etiqueta y reaplica la contraseña.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef: { key: banca/db, property: username }
    - secretKey: password
      remoteRef: { key: banca/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: banca-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: vault-banca
  target:
    name: banca-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: banca/s3, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: banca/s3, property: ACCESS_SECRET_KEY }
