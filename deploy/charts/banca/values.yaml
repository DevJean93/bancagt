# Valores por defecto del chart. Los del entorno productivo están en
# deploy/envs/prod/values.yaml (ahí la CI escribe tag y digest de cada imagen).

dominio: 127.0.0.1.nip.io
registro: ghcr.io/devjean93/bancagt

# Plantilla común de los microservicios.
# - rutas: prefijos que Traefik envía al servicio ("/" = portal web).
# - db: monta credenciales y CA de PostgreSQL.
# - jwt: "privada" (solo identidad firma) | "publica" (verifica) | "" (no usa).
servicios:
  web-banca:
    imagen: { tag: "", digest: "" }
    rutas: ["/"]
    replicas: 2
    uid: 101
    db: false
    jwt: ""
    metricas: false
    env: {}
    recursos:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  api-identidad:
    imagen: { tag: "", digest: "" }
    rutas: ["/api/v1/auth"]
    replicas: 2
    uid: 65532
    db: true
    jwt: privada
    metricas: true
    env:
      LOG_LEVEL: info
      SESION_MINUTOS: "15"
      FAULT_RATE: "0"
      FAULT_LATENCY_MS: "0"
    recursos:
      # Argon2id usa ~19 MiB por verificación: se reserva memoria extra.
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 320Mi }
  api-cuentas:
    imagen: { tag: "", digest: "" }
    rutas: ["/api/v1/cuentas"]
    replicas: 2
    uid: 65532
    db: true
    jwt: publica
    metricas: true
    env:
      LOG_LEVEL: info
      FAULT_RATE: "0"
      FAULT_LATENCY_MS: "0"
    recursos:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 256Mi }
  api-transferencias:
    imagen: { tag: "", digest: "" }
    rutas: ["/api/v1/transferencias", "/api/v1/beneficiarios"]
    replicas: 2
    uid: 65532
    db: true
    jwt: publica
    metricas: true
    env:
      LOG_LEVEL: info
      FAULT_RATE: "0"
      FAULT_LATENCY_MS: "0"
    recursos:
      requests: { cpu: 25m, memory: 96Mi }
      limits: { memory: 256Mi }

# Job de base de datos: prisma migrate deploy + datos semilla (hook de Argo CD).
migraciones:
  imagen: { tag: "", digest: "" }
  sembrar: "si"

# Despliegue progresivo (Argo Rollouts + Traefik).
canary:
  pasos:
    - setWeight: 10
    - pause: { duration: 60s }
    - setWeight: 25
    - pause: { duration: 60s }
    - setWeight: 50
    - pause: { duration: 60s }
  # Compuertas del análisis automático (si se violan → rollback).
  maxTasaError: "0.01"   # 1 % de respuestas 5xx
  maxLatenciaP95: "0.3"  # 300 ms
  prometheus: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090

# Límite de peticiones por IP en el Ingress (mitiga fuerza bruta y abuso).
rateLimit:
  promedio: 50
  rafaga: 100

baseDatos:
  instancias: 2
  almacenamiento: 1Gi
  # DRP: cada "generación" escribe sus WAL en una carpeta distinta del bucket.
  generacion: 1
  # Si se indica (p. ej. "banca-db-g1"), el clúster se crea RECUPERANDO
  # desde ese respaldo en lugar de inicializarse vacío.
  recuperarDe: ""
  # Momento objetivo de recuperación (PITR). Vacío = lo más reciente posible.
  recuperarHasta: ""
  respaldo:
    bucket: s3://cnpg/
    endpoint: http://bancagt-s3:8333
    retencion: 7d
    horario: "0 0 * * * *"   # base backup cada hora (los WAL son continuos)

vault:
  servidor: http://vault.vault.svc:8200
  rol: banca
