# Entorno productivo (rama main). La CI actualiza imagen.tag e imagen.digest
# después de escanear, firmar y publicar cada imagen. Argo CD lo aplica solo.
servicios:
  web-banca:
    imagen:
      tag: ""
      digest: ""
  api-identidad:
    imagen:
      tag: ""
      digest: ""
  api-cuentas:
    imagen:
      tag: ""
      digest: ""
    env:
      LOG_LEVEL: info
      FAULT_RATE: "0"
      FAULT_LATENCY_MS: "0"
  api-transferencias:
    imagen:
      tag: ""
      digest: ""
    env:
      LOG_LEVEL: info
      FAULT_RATE: "0"
      FAULT_LATENCY_MS: "0"

migraciones:
  imagen:
    tag: ""
    digest: ""

baseDatos:
  generacion: 2 # g1 se usó con el esquema SQL anterior; g2 nace con migraciones Prisma
  recuperarDe: ""
