# PKI interna del laboratorio: una CA raíz propia (bancagt-ca) emite y rota
# automáticamente los certificados de todos los servicios expuestos.
# En producción se reemplaza el emisor por una CA corporativa o ACME.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: autofirmado
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bancagt-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: BancaGT Root CA (laboratorio)
  secretName: bancagt-ca
  duration: 87600h # 10 años
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    kind: ClusterIssuer
    name: autofirmado
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bancagt-ca
spec:
  ca:
    secretName: bancagt-ca
