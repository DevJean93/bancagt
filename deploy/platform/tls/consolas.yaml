# Consolas de administración publicadas por HTTPS (TLS 1.3) con certificado
# de la CA interna. Todas exigen autenticación propia.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-tls
  namespace: argocd
spec:
  secretName: argocd-tls
  dnsNames: [argocd.127.0.0.1.nip.io]
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef: { kind: ClusterIssuer, name: bancagt-ca }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - kind: Rule
      match: Host(`argocd.127.0.0.1.nip.io`)
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-tls
---
