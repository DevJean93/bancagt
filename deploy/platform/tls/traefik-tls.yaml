# TLSOption "default": aplica a TODAS las rutas HTTPS del clúster.
# Solo TLS 1.3 (PCI-DSS 4.2.1: criptografía robusta en tránsito).
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  minVersion: VersionTLS13
  sniStrict: true
---
# Encabezados de seguridad en el entrypoint HTTPS (se aplican a todas las respuestas).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: seguridad
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: traefik
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      interval: 15s
      # Conserva la etiqueta "service" de Traefik (servicio de destino) en lugar
      # de reemplazarla por el nombre del Service de métricas.
      honorLabels: true
