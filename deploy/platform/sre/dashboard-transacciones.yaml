apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-bancagt-transacciones
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bancagt-transacciones.json: |
    {
      "uid": "bancagt-transacciones",
      "title": "BancaGT · Transacciones",
      "tags": ["bancagt", "negocio", "auditoria"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "canal",
            "label": "Canal",
            "description": "web = clientes reales del portal · sintetico = monitoreo k6 (usuario sonda)",
            "type": "custom",
            "query": "web,sintetico",
            "includeAll": true,
            "allValue": ".*",
            "multi": false,
            "current": { "selected": true, "text": "web", "value": "web" },
            "options": [
              { "selected": false, "text": "All", "value": "$__all" },
              { "selected": true, "text": "web", "value": "web" },
              { "selected": false, "text": "sintetico", "value": "sintetico" }
            ]
          }
        ]
      },
      "panels": [
        { "type": "stat", "title": "Completadas en el periodo", "gridPos": { "x": 0, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum(count_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | resultado=\"completada\" [$__range]))", "refId": "A", "queryType": "instant" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "noValue": "0", "color": { "mode": "fixed", "fixedColor": "green" } } } },

        { "type": "stat", "title": "Rechazadas en el periodo", "gridPos": { "x": 6, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum(count_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | resultado=\"rechazada\" [$__range]))", "refId": "A", "queryType": "instant" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "noValue": "0", "color": { "mode": "fixed", "fixedColor": "orange" } } } },

        { "type": "stat", "title": "Reintentos sin doble cargo", "description": "Peticiones repetidas con la misma Idempotency-Key: devolvieron la operación original sin cobrar otra vez.", "gridPos": { "x": 12, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum(count_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | resultado=\"repetida\" [$__range]))", "refId": "A", "queryType": "instant" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "decimals": 0, "noValue": "0" } } },

        { "type": "stat", "title": "Monto transferido (GTQ)", "gridPos": { "x": 18, "y": 0, "w": 6, "h": 5 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum(sum_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | resultado=\"completada\" | moneda=\"GTQ\" | unwrap monto [$__range]))", "refId": "A", "queryType": "instant" }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "currencyGTQ", "decimals": 2, "noValue": "0" } } },

        { "type": "timeseries", "title": "Transferencias por resultado (canal: $canal)", "gridPos": { "x": 0, "y": 5, "w": 14, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum by (resultado) (count_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" [$__interval]))", "legendFormat": "{{resultado}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "drawStyle": "bars", "fillOpacity": 70, "stacking": { "mode": "normal" } } } } },

        { "type": "bargauge", "title": "Motivos de rechazo (canal: $canal)", "gridPos": { "x": 14, "y": 5, "w": 10, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "sum by (codigo) (count_over_time({namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | resultado=\"rechazada\" [$__range]))", "legendFormat": "{{codigo}}", "refId": "A", "queryType": "instant" }],
          "options": { "orientation": "horizontal", "displayMode": "basic" },
          "fieldConfig": { "defaults": { "decimals": 0, "color": { "mode": "fixed", "fixedColor": "orange" } } } },

        { "type": "logs", "title": "Bitácora de auditoría (canal: $canal)", "description": "Un registro por intento: canal, usuario, referencia, resultado, monto, cuentas enmascaradas y motivo de rechazo.", "gridPos": { "x": 0, "y": 13, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [{ "expr": "{namespace=\"banca-prod\", container=\"api-transferencias\"} | json | evento=\"transferencia\" | canal=~\"$canal\" | line_format \"{{.resultado | upper}}  {{.referencia}}  {{.monto}} {{.moneda}}  {{.origen}} → {{.destino}}  {{.tipoDestino}}  {{.usuario}} [{{.canal}}]  {{.codigo}}\"", "refId": "A" }],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true } },

        { "type": "timeseries", "title": "Todas las transferencias por minuto (métrica Prometheus, incluye sintéticas)", "gridPos": { "x": 0, "y": 25, "w": 24, "h": 7 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "expr": "sum by (resultado) (rate(banca_operaciones_total{operacion=\"transferencia\"}[5m])) * 60", "legendFormat": "{{resultado}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short" } } }
      ]
    }
