# Monitoreo sintético: un cliente k6 recorre el flujo real del portal 24/7
# entrando por el Ingress (HTTPS) igual que un usuario: inicia sesión, consulta
# cuentas y movimientos, y transfiere entre sus propias cuentas. Garantiza que
# siempre haya datos para los SLI y para el análisis del canary.
apiVersion: v1
kind: Namespace
metadata:
  name: banca-sinteticos
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-sondeo
  namespace: banca-sinteticos
data:
  sondeo.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    const BASE = 'https://banca.127.0.0.1.nip.io';
    const CABECERAS = { 'Content-Type': 'application/json', Origin: BASE };

    export const options = {
      insecureSkipTLSVerify: true, // CA interna del laboratorio
      // k6 vacía las cookies al final de cada iteración por defecto; la sesión
      // (cookie HttpOnly) debe sobrevivir entre iteraciones como en un navegador.
      noCookiesReset: true,
      // Identifica el tráfico sintético en la bitácora (campo canal="sintetico").
      userAgent: 'bancagt-sonda-sintetica/1.0 (k6)',
      scenarios: {
        sondeo: {
          executor: 'constant-arrival-rate',
          rate: 5,
          timeUnit: '1s',
          duration: '8760h',
          preAllocatedVUs: 5,
          maxVUs: 20,
        },
      },
    };

    // Estado por VU: sesión (cookie en el jar de k6) y cuentas del usuario "sonda".
    let sesionHasta = 0;
    let cuentas = [];
    let sentido = false;

    function asegurarSesion() {
      if (Date.now() < sesionHasta - 60_000 && cuentas.length) return true;
      const r = http.post(`${BASE}/api/v1/auth/sesion`, JSON.stringify({ usuario: 'sonda', contrasena: 'BancaGT#2026' }), {
        headers: CABECERAS, tags: { flujo: 'login' },
      });
      if (!check(r, { 'login 200': (x) => x.status === 200 })) return false;
      sesionHasta = Date.parse(r.json('expiraEn'));
      const c = http.get(`${BASE}/api/v1/cuentas`, { tags: { flujo: 'cuentas' } });
      cuentas = c.status === 200 ? c.json('cuentas').filter((x) => x.moneda === 'GTQ') : [];
      return cuentas.length > 0;
    }

    // Si el servidor rechaza la sesión (expiró, se rotaron llaves o se recreó la
    // base), se descarta y la próxima iteración inicia sesión de nuevo.
    function revisarSesion(r) {
      if (r.status === 401) {
        sesionHasta = 0;
        cuentas = [];
      }
      return r;
    }

    export default function () {
      if (!asegurarSesion()) return;
      const n = Math.floor(Math.random() * 100);
      if (n < 8 && cuentas.length >= 2) {
        // Transferencia de Q1 entre cuentas propias, alternando el sentido (saldo neto constante).
        sentido = !sentido;
        const [a, b] = sentido ? [cuentas[0], cuentas[1]] : [cuentas[1], cuentas[0]];
        const r = revisarSesion(http.post(
          `${BASE}/api/v1/transferencias`,
          JSON.stringify({ cuentaOrigenId: a.id, destino: { tipo: 'PROPIA', cuentaId: b.id }, monto: '1.00', concepto: 'Monitoreo sintético' }),
          { headers: { ...CABECERAS, 'Idempotency-Key': `sondeo-${__VU}-${__ITER}-${Date.now()}` }, tags: { flujo: 'transferencia' } },
        ));
        check(r, { 'transferencia 2xx o regla de negocio': (x) => x.status === 201 || x.status === 422 });
      } else if (n < 20) {
        check(http.get(`${BASE}/`, { tags: { flujo: 'portal' } }), { 'portal 200': (x) => x.status === 200 });
      } else if (n < 45) {
        const c = cuentas[n % cuentas.length];
        check(revisarSesion(http.get(`${BASE}/api/v1/cuentas/${c.id}/movimientos?tamano=10`, { tags: { flujo: 'movimientos' } })), { 'movimientos 200': (x) => x.status === 200 });
      } else {
        check(revisarSesion(http.get(`${BASE}/api/v1/cuentas`, { tags: { flujo: 'saldo' } })), { 'saldo 200': (x) => x.status === 200 });
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-sondeo
  namespace: banca-sinteticos
  labels:
    app.kubernetes.io/name: k6-sondeo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k6-sondeo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-sondeo
      annotations:
        # Reinicia el pod cuando cambia el script.
        bancagt/version-script: "4"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        runAsGroup: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.4.0
          args: ["run", "--quiet", "/scripts/sondeo.js"]
          env:
            - name: K6_NO_USAGE_REPORT
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: k6-sondeo
        - name: tmp
          emptyDir: {}
