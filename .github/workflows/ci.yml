# Pipeline DevSecOps de BancaGT (lado nube de la Propuesta C).
# PR → pruebas + SAST + SCA + secretos + build + Trivy (sin publicar).
# main → lo anterior + push a GHCR + SBOM + firma cosign + bump del tag en deploy/
#        → Argo CD (en la laptop) jala el cambio y Argo Rollouts hace el canary.
# Todas las acciones se fijan por SHA (NIST SSDF PS.3 / PW.4: integridad de dependencias).
name: ci

on:
  push:
    branches: [main, develop]
    paths-ignore: ['docs/**', 'informe/**', '**.md']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/devjean93/bancagt

jobs:
  # ---------------------------------------------------------------
  cambios:
    name: Detectar servicios modificados
    runs-on: ubuntu-latest
    outputs:
      # "comun" no es una imagen: se excluye de la matriz.
      servicios: ${{ steps.lista.outputs.servicios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filtro
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Un cambio en un paquete compartido o en el lockfile reconstruye a sus consumidores.
          filters: |
            comun: &comun ['packages/plataforma/**', 'package-lock.json', 'docker/servicio-node.Dockerfile']
            api-identidad: [*comun, 'apps/api-identidad/**', 'packages/db-identidad/**']
            api-cuentas: [*comun, 'apps/api-cuentas/**', 'packages/db-core/**']
            api-transferencias: [*comun, 'apps/api-transferencias/**', 'packages/db-core/**']
            db-migraciones: [*comun, 'apps/db-migraciones/**', 'packages/db-core/**', 'packages/db-identidad/**']
            web-banca: ['apps/web-banca/**', 'docker/web.Dockerfile', 'package-lock.json']
      - id: lista
        env:
          CAMBIOS: ${{ steps.filtro.outputs.changes }}
        run: echo "servicios=$(echo "$CAMBIOS" | jq -c 'map(select(. != "comun"))')" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------
  pruebas:
    name: Pruebas, tipos y SCA (monorepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias (lockfile, sin scripts de instalación)
        run: npm ci --ignore-scripts
      - name: Generar clientes Prisma (ORM)
        run: |
          npx prisma generate --schema packages/db-core/prisma/schema.prisma
          npx prisma generate --schema packages/db-identidad/prisma/schema.prisma
      - name: Verificación de tipos (backend y frontend)
        run: npx tsc -b && npx tsc -p apps/web-banca/tsconfig.json
      - name: Pruebas unitarias (Vitest) con cobertura
        run: npx vitest run --coverage.enabled --coverage.reporter=text --coverage.reporter=json-summary
      - name: SCA - npm audit (falla con HIGH o CRITICAL en producción)
        run: npm audit --omit=dev --audit-level=high
      - name: SCA - Trivy filesystem (lockfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ---------------------------------------------------------------
  secretos:
    name: Secretos en el código (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep (reglas OWASP Top 10, Node.js, secretos, Dockerfile)
        run: |
          semgrep scan --config p/owasp-top-ten --config p/nodejs --config p/javascript \
            --config p/secrets --config p/dockerfile --config p/kubernetes \
            --sarif --output semgrep.sarif --error --severity ERROR \
            --exclude '**/generated/**' apps/ packages/ deploy/
      - name: Publicar hallazgos en la pestaña Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reporte-semgrep
          path: semgrep.sarif

  # ---------------------------------------------------------------
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  # ---------------------------------------------------------------
  iac:
    name: Escaneo de IaC y manifiestos (Trivy config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 1) Reporte completo (todas las severidades) para la pestaña Security.
      - name: Trivy config - reporte SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          format: sarif
          output: trivy-config.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      # 2) Compuerta: el pipeline se detiene solo con hallazgos HIGH o CRITICAL.
      - name: Trivy config - compuerta (falla con HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  # ---------------------------------------------------------------
  servicio:
    name: ${{ matrix.servicio }}
    needs: [cambios, pruebas, secretos, sast]
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push a GHCR
      id-token: write      # firma keyless de cosign (OIDC)
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.cambios.outputs.servicios) }}
    env:
      IMAGEN: ghcr.io/devjean93/bancagt/${{ matrix.servicio }}
      DOCKERFILE: ${{ matrix.servicio == 'web-banca' && 'docker/web.Dockerfile' || 'docker/servicio-node.Dockerfile' }}
      PUBLICAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Versión de la imagen
        id: ver
        run: echo "tag=1.0.${{ github.run_number }}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # --- Build multi-stage ---
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (sin push) para escanear
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            SERVICIO=${{ matrix.servicio }}
            APP_VERSION=${{ steps.ver.outputs.tag }}
          tags: ${{ env.IMAGEN }}:${{ steps.ver.outputs.tag }}
          load: true
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

      # --- Escaneo de la imagen: compuerta de seguridad ---
      - name: Trivy image (reporte SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGEN }}:${{ steps.ver.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.servicio }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ matrix.servicio }}.sarif
          category: trivy-${{ matrix.servicio }}
      - name: Trivy image (compuerta - falla con CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ env.IMAGEN }}:${{ steps.ver.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          output: trivy-${{ matrix.servicio }}.txt
      - name: Resumen de Trivy
        if: always()
        working-directory: .
        run: cat trivy-${{ matrix.servicio }}.txt >> "$GITHUB_STEP_SUMMARY" || true

      # --- Publicación (solo main) ---
      - name: Login a GHCR
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push a GHCR
        id: build
        if: env.PUBLICAR == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          build-args: |
            SERVICIO=${{ matrix.servicio }}
            APP_VERSION=${{ steps.ver.outputs.tag }}
          tags: ${{ env.IMAGEN }}:${{ steps.ver.outputs.tag }}
          push: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.servicio }}

      - name: SBOM CycloneDX (Syft)
        if: env.PUBLICAR == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.servicio }}.cdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: env.PUBLICAR == 'true'
      - name: Firmar imagen y adjuntar SBOM (cosign keyless)
        if: env.PUBLICAR == 'true'
        working-directory: .
        env:
          REF: ${{ env.IMAGEN }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-${{ matrix.servicio }}.cdx.json "$REF"

      - name: Guardar resultado para el bump
        if: env.PUBLICAR == 'true'
        working-directory: .
        run: |
          mkdir -p salida
          printf '{"servicio":"%s","tag":"%s","digest":"%s"}' \
            "${{ matrix.servicio }}" "${{ steps.ver.outputs.tag }}" "${{ steps.build.outputs.digest }}" \
            > salida/${{ matrix.servicio }}.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidencias-${{ matrix.servicio }}
          path: |
            trivy-${{ matrix.servicio }}.txt
            trivy-${{ matrix.servicio }}.sarif
            sbom-${{ matrix.servicio }}.cdx.json
            salida/${{ matrix.servicio }}.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  bump:
    name: Actualizar tag en el repo GitOps
    needs: [servicio, codeql, iac]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidencias-*
          merge-multiple: true
      - name: Escribir tag@digest en deploy/envs/prod/values.yaml
        run: |
          for f in salida/*.json; do
            svc=$(jq -r .servicio "$f"); tag=$(jq -r .tag "$f"); dig=$(jq -r .digest "$f")
            # yq viene preinstalado en los runners de GitHub.
            # db-migraciones es un Job, no un servicio con Rollout.
            if [ "$svc" = "db-migraciones" ]; then ruta=".migraciones"; else ruta=".servicios.\"$svc\""; fi
            yq -i "$ruta.imagen.tag = \"$tag\" | $ruta.imagen.digest = \"$dig\"" deploy/envs/prod/values.yaml
            echo "- $svc → $tag ($dig)" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Commit del bump (lo jala Argo CD)
        run: |
          git config user.name "bancagt-ci[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/prod/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(deploy): nuevas imágenes firmadas [skip ci]"
          git push
