# Nginx no privilegiado: escucha en 8080, sin versión expuesta y con
# encabezados de seguridad. HSTS y TLS 1.3 se aplican en el Ingress (Traefik).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
        try_files $uri $uri/ /index.html;
        limit_except GET HEAD { deny all; }
    }
}
